name: Keep scheduled workflows active

on:
  schedule:
    - cron: '17 4 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record repository activity
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/workflow-heartbeat
      - name: Commit heartbeat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflow-heartbeat
          if git diff --cached --quiet; then
            echo "Heartbeat is unchanged."
            exit 0
          fi
          git commit -m "chore: keep scheduled workflows active"
          git push
